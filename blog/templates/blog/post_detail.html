<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
</head>
<body>
    <nav>
        <a href="{% url 'blog:post_list' %}">← Все посты</a> |
        <a href="{% url 'about' %}">О нас</a>
    </nav>

    <article>
        <h1>{{ post.title }}</h1>
        <p><small>Опубликовано: {{ post.created_at|date:"d.m.Y H:i" }}</small></p>
        <div>{{ post.content|linebreaks }}</div>
    </article>
</body>
</html>
