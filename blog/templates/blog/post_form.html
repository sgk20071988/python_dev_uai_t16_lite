<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование поста</title>
</head>
<body>
    <h1>Редактировать пост</h1>

    <form method="post">
        {% csrf_token %}

        <a href="{% url 'blog:post_list' %}">Отмена</a>
    </form>
</body>
</html>
