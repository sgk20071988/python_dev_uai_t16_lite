<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пост</title>
</head>
<body>
    <h1>Добавить пост</h1>

    <form method="post" novalidate>
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div style="color: red;">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for field in form %}
            <p>
                {{ field.label_tag }}<br>
                {{ field }}
                {% if field.errors %}
                    <span style="color: red;">{{ field.errors }}</span>
                {% endif %}
            </p>
        {% endfor %}

        <button type="submit">Сохранить</button>
        <a href="{% url 'blog:post_list' %}">Отмена</a>
    </form>
</body>
</html>
