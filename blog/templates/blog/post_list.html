<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой блог</title>
</head>
<body>
    <h1>Все записи блога</h1>
    <p><a href="{% url 'blog:post_create' %}">+ Добавить пост</a></p>

    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p><small>{{ post.created_at|date:"d.m.Y H:i" }}</small></p>
            <p>{{ post.content|truncatewords:30 }}</p>
        </article>
        <hr>
    {% empty %}
        <p>Пока нет ни одной записи.</p>
    {% endfor %}
</body>
</html>
